<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hravá čeština – Vyjmenovaná slova</title>
  
  <!-- Ikona na plochu (iOS & Android) -->
  <link rel="apple-touch-icon" href="iconC.png">
  <link rel="icon" type="image/png" sizes="192x192" href="iconC.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Čeština">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --error: #dc2626;
      --error-bg: #fee2e2;
      --warning: #f59e0b;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Horní lišta */
    header {
      background: var(--card-bg);
      padding: 14px 20px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .star-badge {
      background: #fef3c7;
      color: #b45309;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sound-btn {
      background: #f1f5f9;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }

    .sound-btn:active {
      transform: scale(0.92);
    }

    /* Ovládací panel - režim a písmena */
    .controls {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
    }

    .mode-btn {
      border: none;
      padding: 8px 12px;
      border-radius: 9px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .letters-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .letter-btn {
      border: 2px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.95rem;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .letter-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
    }

    /* Hlavní herní karta */
    .game-card {
      background: var(--card-bg);
      padding: 28px 20px;
      border-radius: 24px;
      box-shadow: var(--shadow);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #f1f5f9;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .word-display {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-main);
      margin: 8px 0;
      line-height: 1.2;
    }

    .blank {
      display: inline-block;
      min-width: 44px;
      height: 44px;
      vertical-align: middle;
      border-bottom: 4px solid var(--primary);
      color: var(--primary);
      background: #eff6ff;
      border-radius: 8px;
      margin: 0 2px;
    }

    .blank.correct {
      border-color: var(--success);
      color: var(--success);
      background: var(--success-bg);
    }

    .blank.wrong {
      border-color: var(--error);
      color: var(--error);
      background: var(--error-bg);
    }

    .sentence-hint {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 1.05rem;
      color: #334155;
      line-height: 1.4;
      width: 100%;
    }

    /* Tlačítka i / í / y / ý */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
    }

    .option-btn {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 16px 0;
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 4px 0 #cbd5e1;
    }

    .option-btn:hover:not(:disabled) {
      background: #eff6ff;
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--primary);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #cbd5e1;
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.7;
    }

    .option-btn.btn-correct {
      background: var(--success);
      border-color: #15803d;
      color: white;
      box-shadow: 0 4px 0 #15803d;
      opacity: 1;
    }

    .option-btn.btn-wrong {
      background: var(--error);
      border-color: #b91c1c;
      color: white;
      box-shadow: 0 4px 0 #b91c1c;
      opacity: 1;
    }

    /* Zpětná vazba a vysvětlení */
    .feedback-box {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      text-align: left;
      display: none;
      flex-direction: column;
      gap: 6px;
      animation: fadeIn 0.25s ease;
    }

    .feedback-box.show {
      display: flex;
    }

    .feedback-box.success {
      background: var(--success-bg);
      border: 1px solid #86efac;
      color: #14532d;
    }

    .feedback-box.error {
      background: var(--error-bg);
      border: 1px solid #fca5a5;
      color: #7f1d1d;
    }

    .feedback-title {
      font-weight: 800;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .feedback-desc {
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .next-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: var(--primary);
      color: white;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      display: none;
      box-shadow: 0 4px 0 #1e40af;
      transition: all 0.15s;
    }

    .next-btn.show {
      display: block;
    }

    .next-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e40af;
    }

    /* Výsledková obrazovka výzvy */
    .summary-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .summary-screen.show {
      display: flex;
    }

    .score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #eff6ff;
      border: 5px solid var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--primary);
    }

    .score-circle span {
      font-size: 2rem;
      line-height: 1;
    }

    .mistakes-list {
      width: 100%;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mistake-item {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 400px) {
      .word-display { font-size: 2.1rem; }
      .option-btn { font-size: 1.45rem; padding: 14px 0; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="logo">📚 Hravá čeština</div>
      <div class="stats">
        <div class="star-badge">⭐ <span id="starCount">0</span></div>
        <button class="sound-btn" id="soundToggle" title="Zapnout/vypnout zvuk">🔊</button>
      </div>
    </header>

    <section class="controls">
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="practice">♾️ Volný trénink</button>
        <button class="mode-btn" data-mode="challenge">🏆 Výzva (10 slov)</button>
      </div>
      <div class="letters-grid" id="lettersGrid">
        <button class="letter-btn active" data-letter="ALL">Mix všech</button>
        <button class="letter-btn" data-letter="B">B</button>
        <button class="letter-btn" data-letter="L">L</button>
        <button class="letter-btn" data-letter="M">M</button>
        <button class="letter-btn" data-letter="P">P</button>
        <button class="letter-btn" data-letter="S">S</button>
        <button class="letter-btn" data-letter="V">V</button>
        <button class="letter-btn" data-letter="Z">Z</button>
      </div>
    </section>

    <main class="game-card" id="gameCard">
      <div class="progress-bar-wrap" id="progressWrap" style="display: none;">
        <div class="progress-info">
          <span id="questionCounter">Otázka 1 / 10</span>
          <span id="challengeScore">Správně: 0</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div id="quizArea" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px;">
        <div class="word-display" id="wordDisplay">b<span class="blank"></span>t</div>
        <div class="sentence-hint" id="sentenceHint">Chci <strong>b_t</strong> dobrým kamarádem.</div>

        <div class="options-grid" id="optionsGrid">
          <button class="option-btn" data-val="i">i</button>
          <button class="option-btn" data-val="í">í</button>
          <button class="option-btn" data-val="y">y</button>
          <button class="option-btn" data-val="ý">ý</button>
        </div>

        <div class="feedback-box" id="feedbackBox">
          <div class="feedback-title" id="feedbackTitle"></div>
          <div class="feedback-desc" id="feedbackDesc"></div>
        </div>

        <button class="next-btn" id="nextBtn">Další slovo ➔</button>
      </div>

      <div class="summary-screen" id="summaryScreen">
        <h2 style="font-size: 1.5rem;">Výzva dokončena! 🎉</h2>
        <div class="score-circle">
          <span id="finalScore">8/10</span>
          <small>bodů</small>
        </div>
        <p id="summaryMessage" style="color: var(--text-muted); font-weight: 600;"></p>
        <div class="mistakes-list" id="mistakesList"></div>
        <button class="next-btn show" id="restartBtn">Hrát znovu 🔄</button>
      </div>
    </main>
  </div>

  <script>
    const WORD_BANK = [
      // B
      { letter: "B", before: "b", after: "t", ans: "ý", sentence: "Chci <strong>b_t</strong> dobrým fotbalistou.", type: "Vyjmenované slovo", rule: "Být (existovat, stát se něčím) je vyjmenované slovo po B." },
      { letter: "B", before: "b", after: "t", ans: "í", sentence: "Nesmíme se navzájem <strong>b_t</strong>.", type: "Nevyjmenované slovo", rule: "Bít (tlouct, udeřit) není vyjmenované slovo, píšeme měkké í." },
      { letter: "B", before: "b", after: "dlit", ans: "y", sentence: "V našem domě <strong>b_dlí</strong> milí sousedé.", type: "Vyjmenované slovo", rule: "Bydlit je vyjmenované slovo po B." },
      { letter: "B", before: "ob", after: "vatel", ans: "y", sentence: "Každý <strong>ob_vatel</strong> města má svůj hlas.", type: "Slovo příbuzné", rule: "Slovo příbuzné k vyjmenovanému slovu bydlit." },
      { letter: "B", before: "b", after: "strý", ans: "y", sentence: "Liška je velmi <strong>b_stré</strong> zvíře.", type: "Vyjmenované slovo", rule: "Bystrý je vyjmenované slovo po B." },
      { letter: "B", before: "b", after: "lina", ans: "y", sentence: "Na louce roste léčivá <strong>b_lina</strong>.", type: "Vyjmenované slovo", rule: "Bylina je vyjmenované slovo po B." },
      { letter: "B", before: "kob", after: "la", ans: "y", sentence: "Na pastvině se pase hnědá <strong>kob_la</strong>.", type: "Vyjmenované slovo", rule: "Kobyla je vyjmenované slovo po B." },
      { letter: "B", before: "b", after: "k", ans: "ý", sentence: "Na louce se pásl silný <strong>b_k</strong>.", type: "Vyjmenované slovo", rule: "Býk je vyjmenované slovo po B." },
      { letter: "B", before: "Přib", after: "slav", ans: "y", sentence: "Město <strong>Přib_slav</strong> leží na Vysočině.", type: "Vyjmenované slovo", rule: "Přibyslav je vyjmenované slovo po B." },
      { letter: "B", before: "bab", after: "čka", ans: "i", sentence: "Moje <strong>bab_čka</strong> peče nejlepší buchty.", type: "Nevyjmenované slovo", rule: "Babička není vyjmenované ani příbuzné slovo." },
      { letter: "B", before: "b", after: "č", ans: "i", sentence: "Kočí práskl dlouhým <strong>b_čem</strong>.", type: "Nevyjmenované slovo", rule: "Bič není vyjmenované slovo, píšeme měkké i." },
      { letter: "B", before: "nab", after: "dka", ans: "í", sentence: "V obchodě mají výhodnou <strong>nab_dku</strong>.", type: "Nevyjmenované slovo", rule: "Nabídka (od nabízet) není vyjmenované slovo." },
      { letter: "B", before: "odb", after: "rat", ans: "í", sentence: "Musíme pravidelně <strong>odb_rat</strong> časopis.", type: "Nevyjmenované slovo", rule: "Odbírat (od brát) se píše s měkkým í." },
      { letter: "B", before: "nab", after: "zet", ans: "í", sentence: "Chci ti <strong>nab_zet</strong> svou pomoc.", type: "Nevyjmenované slovo", rule: "Nabízet není vyjmenované slovo." },

      // L
      { letter: "L", before: "sl", after: "šet", ans: "y", sentence: "Z dálky je <strong>sl_šet</strong> zpěv ptáků.", type: "Vyjmenované slovo", rule: "Slyšet je vyjmenované slovo po L." },
      { letter: "L", before: "ml", after: "n", ans: "ý", sentence: "U potoka stojí starý vodní <strong>ml_n</strong>.", type: "Vyjmenované slovo", rule: "Mlýn je vyjmenované slovo po L." },
      { letter: "L", before: "bl", after: "skat se", ans: "ý", sentence: "Na obloze se začalo <strong>bl_skat</strong>.", type: "Vyjmenované slovo", rule: "Blýskat se je vyjmenované slovo po L." },
      { letter: "L", before: "bl", after: "zký", ans: "í", sentence: "Můj <strong>bl_zký</strong> kamarád bydlí vedle.", type: "Nevyjmenované slovo", rule: "Blízký (blízko) není vyjmenované slovo, pozor na záměnu s blýskat se!" },
      { letter: "L", before: "pol", after: "kat", ans: "y", sentence: "Musíš sousto dobře rozkousat a pak <strong>pol_kat</strong>.", type: "Vyjmenované slovo", rule: "Polykat je vyjmenované slovo po L." },
      { letter: "L", before: "pl", after: "nout", ans: "y", sentence: "Čas rychle <strong>pl_ne</strong> jako voda.", type: "Vyjmenované slovo", rule: "Plynout je vyjmenované slovo po L." },
      { letter: "L", before: "pl", after: "tvat", ans: "ý", sentence: "Jídlem se nesmí <strong>pl_tvat</strong>.", type: "Vyjmenované slovo", rule: "Plýtvat je vyjmenované slovo po L." },
      { letter: "L", before: "vzl", after: "kat", ans: "y", sentence: "Malé dítě začalo smutně <strong>vzl_kat</strong>.", type: "Vyjmenované slovo", rule: "Vzlykat je vyjmenované slovo po L." },
      { letter: "L", before: "l", after: "sý", ans: "y", sentence: "Dědeček má už úplně <strong>l_sou</strong> hlavu.", type: "Vyjmenované slovo", rule: "Lysý je vyjmenované slovo po L." },
      { letter: "L", before: "l", after: "ška", ans: "i", sentence: "Zrzavá <strong>l_ška</strong> běžela do lesa.", type: "Nevyjmenované slovo", rule: "Liška není vyjmenované slovo (neplést s lysý!)." },
      { letter: "L", before: "l", after: "tko", ans: "ý", sentence: "Po běhání mě bolí pravé <strong>l_tko</strong>.", type: "Vyjmenované slovo", rule: "Lýtko je vyjmenované slovo po L." },
      { letter: "L", before: "l", after: "ko", ans: "ý", sentence: "Z lipového <strong>l_ka</strong> se pletou košíky.", type: "Vyjmenované slovo", rule: "Lýko je vyjmenované slovo po L." },
      { letter: "L", before: "l", after: "že", ans: "y", sentence: "V zimě jezdíme na hory na <strong>l_že</strong>.", type: "Vyjmenované slovo", rule: "Lyže je vyjmenované slovo po L." },
      { letter: "L", before: "pel", after: "ň", ans: "y", sentence: "Na kraji cesty roste hořký <strong>pel_něk</strong>.", type: "Vyjmenované slovo", rule: "Pelyněk je vyjmenované slovo po L." },
      { letter: "L", before: "l", after: "st", ans: "i", sentence: "Na podzim padá ze stromů barevné <strong>l_stí</strong>.", type: "Nevyjmenované slovo", rule: "List není vyjmenované slovo, píšeme měkké i." },
      { letter: "L", before: "l", after: "ce", ans: "í", sentence: "Polévku jíš velkou <strong>l_cí</strong>.", type: "Nevyjmenované slovo", rule: "Lžíce není vyjmenované slovo, píšeme měkké í." },

      // M
      { letter: "M", before: "m", after: "t", ans: "ý", sentence: "Před jídlem si musíme <strong>m_t</strong> ruce.", type: "Vyjmenované slovo", rule: "Mýt (umývat vodou) je vyjmenované slovo po M." },
      { letter: "M", before: "m", after: "t", ans: "í", sentence: "Chtěl bych <strong>m_t</strong> doma malé štěně.", type: "Nevyjmenované slovo", rule: "Mít (vlastnit) není vyjmenované slovo, píšeme měkké í." },
      { letter: "M", before: "m", after: "dlo", ans: "ý", sentence: "Umyj si ruce vodou a <strong>m_dlem</strong>.", type: "Slovo příbuzné", rule: "Mýdlo je slovo příbuzné k vyjmenovanému slovu mýt." },
      { letter: "M", before: "m", after: "slit", ans: "y", sentence: "Musíš u toho úkolu dobře <strong>m_slit</strong>.", type: "Vyjmenované slovo", rule: "Myslit je vyjmenované slovo po M." },
      { letter: "M", before: "m", after: "lit se", ans: "ý", sentence: "Každý člověk se občas může <strong>m_lit</strong>.", type: "Vyjmenované slovo", rule: "Mýlit se (dělat chybu) je vyjmenované slovo po M." },
      { letter: "M", before: "hm", after: "z", ans: "y", sentence: "Včely, motýli a brouci patří mezi <strong>hm_z</strong>.", type: "Vyjmenované slovo", rule: "Hmyz je vyjmenované slovo po M." },

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'success') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      } else {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(160, now + 0.25);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    function getFilteredWords() {
      if (currentLetter === 'ALL') return [...WORD_BANK];
      return WORD_BANK.filter(w => w.letter === currentLetter);
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function startChallenge() {
      const pool = shuffle(getFilteredWords());
      challengePool = [];
      while (challengePool.length < CHALLENGE_LENGTH) {
        challengePool.push(...shuffle([...pool]));
      }
      challengePool = challengePool.slice(0, CHALLENGE_LENGTH);
      challengeIndex = 0;
      challengeCorrect = 0;
      challengeMistakes = [];
      summaryScreen.classList.remove('show');
      quizArea.style.display = 'flex';
      progressWrap.style.display = 'flex';
      loadNextWord();
    }

      });

      if (currentMode === 'challenge') {
        if (challengeIndex >= CHALLENGE_LENGTH) {
          showChallengeSummary();
          return;
        }
        currentWord = challengePool[challengeIndex];
        questionCounterEl.textContent = `Otázka ${challengeIndex + 1} / ${CHALLENGE_LENGTH}`;

        progressFillEl.style.width = `${(challengeIndex / CHALLENGE_LENGTH) * 100}%`;
      } else {
        progressWrap.style.display = 'none';
        const pool = getFilteredWords();
        let next;
        do {
          next = pool[Math.floor(Math.random() * pool.length)];
        } while (pool.length > 1 && next === currentWord);
        currentWord = next;
      }

      wordDisplayEl.innerHTML = `${currentWord.before}<span class="blank" id="blankSlot"></span>${currentWord.after}`;
      sentenceHintEl.innerHTML = currentWord.sentence;
    }

    function handleAnswer(selectedVal, clickedBtn) {
      const isCorrect = selectedVal === currentWord.ans;
      const blankSlot = document.getElementById('blankSlot');
      blankSlot.textContent = currentWord.ans;

      optionBtns.forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.val === currentWord.ans) {
          btn.classList.add('btn-correct');
        }
      });

      if (isCorrect) {
        blankSlot.classList.add('correct');
        playSound('success');
        stars++;
        localStorage.setItem('cz_stars', stars);
        starCountEl.textContent = stars;

        feedbackBox.className = 'feedback-box success show';
        feedbackTitle.innerHTML = `✅ Skvěle! (${currentWord.type})`;
        feedbackDesc.textContent = currentWord.rule;

        if (currentMode === 'challenge') {
          challengeCorrect++;
          challengeScoreEl.textContent = `Správně: ${challengeCorrect}`;
        }
      } else {
        clickedBtn.classList.add('btn-wrong');
        blankSlot.classList.add('wrong');
        playSound('error');

        feedbackBox.className = 'feedback-box error show';
        feedbackTitle.innerHTML = `❌ Pozor, správně je „${currentWord.before}${currentWord.ans}${currentWord.after}“`;
        feedbackDesc.textContent = `${currentWord.type}: ${currentWord.rule}`;

        if (currentMode === 'challenge') {
          challengeMistakes.push({
            word: `${currentWord.before}${currentWord.ans}${currentWord.after}`,
            chosen: selectedVal,
            rule: currentWord.rule
          });
        }
      }

      if (currentMode === 'challenge') {
        challengeIndex++;
        progressFillEl.style.width = `${(challengeIndex / CHALLENGE_LENGTH) * 100}%`;
        nextBtn.textContent = challengeIndex >= CHALLENGE_LENGTH ? 'Zobrazit výsledky 🏆' : 'Další slovo ➔';
      } else {
        nextBtn.textContent = 'Další slovo ➔';
      }

      nextBtn.classList.add('show');
    }

        summaryMessageEl.textContent = 'Absolutní jednička! Jsi mistr vyjmenovaných slov! 🌟';
      } else if (challengeCorrect >= 7) {
        summaryMessageEl.textContent = 'Velmi dobrá práce! Už ti chybí jen kousek k dokonalosti.';
      } else {
        summaryMessageEl.textContent = 'Dobrý trénink! Zkus si projít chybičky níže a dej si další kolo.';

      mistakesListEl.innerHTML = '';
      if (challengeMistakes.length > 0) {
        const title = document.createElement('div');
        title.style.fontWeight = '700';

      }
    }

        } else {
          summaryScreen.classList.remove('show');
          quizArea.style.display = 'flex';
          loadNextWord();
        }
      });
    });

    letterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        letterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLetter = btn.dataset.letter;
        if (currentMode === 'challenge') {
          startChallenge();
        } else {
          loadNextWord();
        }
      });
    });

    loadNextWord();
  </script>
</body>
</html>
