<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e0f2fe">
<title>Hravá čeština – Vyjmenovaná slova</title>
<link rel="apple-touch-icon" href="iconC.png">
<link rel="icon" type="image/png" sizes="192x192" href="iconC.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Čeština">
<style>
:root{--bg:linear-gradient(135deg,#e0f2fe 0%,#f0fdf4 100%);--card:#fff;--primary:#2563eb;--primary-dark:#1e40af;--success:#16a34a;--success-bg:#dcfce7;--error:#dc2626;--error-bg:#fee2e2;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--shadow:0 10px 25px -5px rgba(0,0,0,.08),0 8px 10px -6px rgba(0,0,0,.04)}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;padding:16px}
button,select{font:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}
.app{width:100%;max-width:600px;display:flex;flex-direction:column;gap:16px}
header{background:var(--card);padding:14px 20px;border-radius:20px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.2rem;font-weight:800;color:var(--primary);border:0;background:none;padding:0}
.stats{display:flex;align-items:center;gap:12px}
.star{background:#fef3c7;color:#92400e;padding:7px 12px;border-radius:999px;font-weight:800}
.sound{border:0;background:#f1f5f9;width:40px;height:40px;border-radius:50%;font-size:1.1rem}
.home,.controls,.game{background:var(--card);padding:24px 20px;border-radius:24px;box-shadow:var(--shadow)}
.home{text-align:center;display:flex;flex-direction:column;gap:18px}
h1{margin:0;color:var(--primary);font-size:1.8rem}
p{line-height:1.5}
.muted{color:var(--muted)}
.primary{background:var(--primary);color:white;border:0;padding:16px;border-radius:16px;font-size:1.1rem;font-weight:800;box-shadow:0 4px 0 var(--primary-dark)}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--primary-dark)}
.controls{display:flex;flex-direction:column;gap:13px;padding:16px}
.mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#f1f5f9;padding:4px;border-radius:12px}
.mode-btn{border:0;border-radius:9px;padding:10px 6px;background:transparent;color:var(--muted);font-weight:700}
.mode-btn.active{background:white;color:var(--primary);box-shadow:0 2px 6px #0000000f}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setting label{display:block;font-size:.82rem;color:var(--muted);font-weight:700;margin:0 0 5px 3px}
select{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text)}
.letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.letter{border:2px solid var(--border);background:#fff;padding:7px 12px;border-radius:11px;font-weight:800}
.letter.active{border-color:var(--primary);background:#eff6ff;color:var(--primary)}
.game{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.progress{width:100%;display:none;flex-direction:column;gap:7px}
.progress-info{display:flex;justify-content:space-between;font-size:.85rem;font-weight:700;color:var(--muted)}
.track{height:8px;background:#f1f5f9;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--primary);transition:width .25s}
.word{font-size:2.6rem;font-weight:800;letter-spacing:1px;line-height:1.25;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:34px;border-bottom:5px solid var(--primary);color:var(--primary);margin:0 3px}
.blank.correct{background:var(--success-bg);border-color:var(--success);color:var(--success);border-radius:4px}
.blank.wrong{background:var(--error-bg);border-color:var(--error);color:var(--error);border-radius:4px}
.sentence{width:100%;padding:13px 15px;border:1px solid var(--border);border-radius:14px;background:#f8fafc;font-size:1.04rem;line-height:1.5;color:#334155}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:320px}
.option{background:#f8fafc;border:2px solid #cbd5e1;border-radius:16px;padding:15px 0;font-size:1.8rem;font-weight:800;box-shadow:0 4px 0 #cbd5e1;color:var(--text)}
.option:disabled{cursor:default;opacity:.8}
.option.good{background:var(--success);border-color:#15803d;color:white;opacity:1}
.option.bad{background:var(--error);border-color:#b91c1c;color:white;opacity:1}
.feedback{display:none;width:100%;padding:15px;border-radius:15px;text-align:left;line-height:1.5}
.feedback.show{display:block}
.feedback.success{background:var(--success-bg);border:1px solid #86efac;color:#14532d}
.feedback.error{background:var(--error-bg);border:1px solid #fca5a5;color:#7f1d1d}
.feedback-title{font-weight:800;margin-bottom:4px}
.next{display:none;width:100%;padding:15px;border:0;border-radius:15px;background:var(--primary);color:white;font-size:1.08rem;font-weight:800;box-shadow:0 4px 0 var(--primary-dark)}
.next.show{display:block}
.summary{display:none;width:100%;flex-direction:column;align-items:center;gap:14px}
.summary.show{display:flex}
.score{width:112px;height:112px;border:5px solid var(--primary);border-radius:50%;background:#eff6ff;color:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.score strong{font-size:2rem}
.mistakes{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.mistake{padding:10px 13px;border:1px solid #fecdd3;background:#fff1f2;border-radius:12px;font-size:.93rem;line-height:1.45}
.small-note{font-size:.85rem;color:var(--muted)}
@media(max-width:400px){body{padding:10px}.word{font-size:2.15rem}.home,.game{padding:21px 15px}.settings{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="logo" id="homeLogo" type="button">📚 Hravá čeština</button>
  <div class="stats"><div class="star" aria-label="Počet získaných hvězdiček">⭐ <span id="starCount">0</span></div>
  <button class="sound" id="soundToggle" type="button" aria-label="Vypnout zvuk" title="Zapnout/vypnout zvuk">🔊</button></div>
</header>

<section class="home" id="homeScreen">
  <h1>Vítej v Hravé češtině! 👋</h1>
  <p class="muted">Procvič si vyjmenovaná slova, příbuzná slova i pravopisné chytáky. Sbírej hvězdičky a staň se mistrem pravopisu!</p>
  <button class="primary" id="startApp">Spustit procvičování 🚀</button>
  <p class="small-note">Tvoje hvězdičky se ukládají v tomto zařízení.</p>
</section>

<div id="gameWrapper" style="display:none;flex-direction:column;gap:16px">
<section class="controls">
  <div class="mode-switch">
    <button class="mode-btn active" data-mode="practice" type="button">♾️ Volný trénink</button>
    <button class="mode-btn" data-mode="challenge" type="button">🏆 Výzva</button>
  </div>
  <div class="settings">
    <div class="setting"><label for="levelSelect">Obtížnost</label>
      <select id="levelSelect">
        <option value="1">1 – Začátečník</option>
        <option value="2" selected>2 – Pokročilý</option>
        <option value="3">3 – Mistr pravopisu</option>
      </select>
    </div>
    <div class="setting"><label for="categorySelect">Druh procvičování</label>
      <select id="categorySelect">
        <option value="all">Všechna slova</option>
        <option value="vyjmenovana">Vyjmenovaná slova</option>
        <option value="pribuzna">Příbuzná a jejich tvary</option>
        <option value="nevyjmenovana">Ostatní slova</option>
        <option value="dvojice">Významové dvojice</option>
      </select>
    </div>
  </div>
  <div class="letters" id="letters">
    <button class="letter active" data-letter="ALL" type="button">Mix všech</button>
    <button class="letter" data-letter="B" type="button">B</button><button class="letter" data-letter="L" type="button">L</button>
    <button class="letter" data-letter="M" type="button">M</button><button class="letter" data-letter="P" type="button">P</button>
    <button class="letter" data-letter="S" type="button">S</button><button class="letter" data-letter="V" type="button">V</button>
    <button class="letter" data-letter="Z" type="button">Z</button>
  </div>
</section>

<main class="game">
  <div class="progress" id="progress">
    <div class="progress-info"><span id="counter">Otázka 1 / 10</span><span id="score">Správně: 0</span></div>
    <div class="track"><div class="fill" id="progressFill"></div></div>
  </div>
  <div id="quiz" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:18px">
    <div class="word" id="wordDisplay" aria-label="Doplň chybějící písmeno">b<span class="blank">&nbsp;</span>ýt</div>
    <div class="sentence" id="sentence" aria-live="polite">Chci <strong>b_t</strong> dobrým kamarádem.</div>
    <div class="options" id="options">
      <button class="option" id="opt1" type="button">i</button><button class="option" id="opt2" type="button">y</button>
    </div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"><div class="feedback-title" id="feedbackTitle"></div><div id="feedbackText"></div></div>
    <button class="next" id="nextBtn" type="button">Další slovo ➔</button>
  </div>
  <section class="summary" id="summary">
    <h2>Výzva dokončena! 🎉</h2>
    <div class="score"><strong id="finalScore">0/10</strong><small>bodů</small></div>
    <p id="summaryMessage" class="muted"></p>
    <div class="mistakes" id="mistakes"></div>
    <button class="next show" id="restart" type="button">Hrát znovu 🔄</button>
  </section>
</main>
</div>
</div>

<script>
"use strict";

/*
 * Každá položka obsahuje:
 * letter – procvičovaná obojetná souhláska
 * before + ans + after – správně sestavené slovo
 * sentence – věta s jedním podtržítkem na místě doplňovaného písmene
 * kind – vyjmenovana / pribuzna / nevyjmenovana / dvojice
 * level – doporučená úroveň 1 až 3
 */
const WORD_BANK = [
  // B – vyjmenovaná slova a příbuzná
  {letter:"B",before:"b",after:"t",ans:"ý",sentence:"Chci <strong>b_t</strong> dobrým kamarádem.",kind:"vyjmenovana",level:1,rule:"Být (existovat nebo stát se něčím) je vyjmenované slovo po B."},
  {letter:"B",before:"b",after:"t",ans:"í",sentence:"Nesmíme se navzájem <strong>b_t</strong>.",kind:"nevyjmenovana",level:1,rule:"Bít znamená tlouct nebo udeřit. Není to vyjmenované slovo."},
  {letter:"B",before:"b",after:"dlit",ans:"y",sentence:"V našem domě chceme <strong>b_dlit</strong>.",kind:"vyjmenovana",level:1,rule:"Bydlit je vyjmenované slovo po B."},
  {letter:"B",before:"ob",after:"vatel",ans:"y",sentence:"Každý <strong>ob_vatel</strong> města má svůj hlas.",kind:"vyjmenovana",level:1,rule:"Obyvatel patří mezi vyjmenovaná slova po B."},
  {letter:"B",before:"b",after:"strá",ans:"y",sentence:"Liška je velmi <strong>b_strá</strong>.",kind:"tvar",level:1,rule:"Bystrý je vyjmenované slovo po B. Ve větě je použit tvar bystrá."},
  {letter:"B",before:"b",after:"lina",ans:"y",sentence:"Na louce roste léčivá <strong>b_lina</strong>.",kind:"vyjmenovana",level:1,rule:"Bylina je vyjmenované slovo po B."},
  {letter:"B",before:"kob",after:"la",ans:"y",sentence:"Na pastvině se pase hnědá <strong>kob_la</strong>.",kind:"vyjmenovana",level:1,rule:"Kobyla je vyjmenované slovo po B."},
  {letter:"B",before:"b",after:"k",ans:"ý",sentence:"Na louce se pásl silný <strong>b_k</strong>.",kind:"vyjmenovana",level:1,rule:"Býk je vyjmenované slovo po B."},
  {letter:"B",before:"Přib",after:"slav",ans:"y",sentence:"Město <strong>Přib_slav</strong> leží na Vysočině.",kind:"vyjmenovana",level:2,rule:"Přibyslav je vlastní jméno zařazované mezi vyjmenovaná slova po B."},
  {letter:"B",before:"b",after:"tě",ans:"y",sentence:"V novém <strong>b_tě</strong> máme velký balkon.",kind:"vyjmenovana",level:1,rule:"Byt (obydlí) patří mezi vyjmenovaná slova po B."},
  {letter:"B",before:"příb",after:"tek",ans:"y",sentence:"Na horách jsme našli útulný <strong>příb_tek</strong>.",kind:"pribuzna",level:2,rule:"Příbytek souvisí se slovem byt."},
  {letter:"B",before:"ná",after:"bytek",ans:"",sentence:"Do nového bytu jsme koupili nábytek.",kind:"pribuzna",level:3,rule:"Nábytek souvisí se slovem byt. Tato položka je informační; v kvízu se nepoužívá jako doplňovačka."},
  {letter:"B",before:"dob",after:"tek",ans:"y",sentence:"Na dvoře chovají hospodářský <strong>dob_tek</strong>.",kind:"vyjmenovana",level:2,rule:"Dobytek patří mezi vyjmenovaná slova po B."},
  {letter:"B",before:"oby",after:"čej",ans:"",sentence:"Obyčej je zvyk, který se předává z generace na generaci.",kind:"vyjmenovana",level:3,rule:"Obyčej patří mezi vyjmenovaná slova po B."},
  {letter:"B",before:"bab",after:"čka",ans:"i",sentence:"Moje <strong>bab_čka</strong> peče nejlepší buchty.",kind:"nevyjmenovana",level:1,rule:"Babička není vyjmenované ani příbuzné slovo."},
  {letter:"B",before:"b",after:"čem",ans:"i",sentence:"Kočí práskl dlouhým <strong>b_čem</strong>.",kind:"nevyjmenovana",level:1,rule:"Bič není vyjmenované slovo."},
  {letter:"B",before:"nab",after:"dku",ans:"í",sentence:"V obchodě mají výhodnou <strong>nab_dku</strong>.",kind:"nevyjmenovana",level:2,rule:"Nabídka souvisí se slovesem nabízet; nejde o vyjmenované slovo."},
  {letter:"B",before:"odb",after:"rat",ans:"í",sentence:"Musíme pravidelně <strong>odb_rat</strong> časopis.",kind:"nevyjmenovana",level:2,rule:"Odbírat se píše s měkkým í."},
  {letter:"B",before:"ub",after:"vat",ans:"ý",sentence:"Síly mu začaly rychle <strong>ub_vat</strong>.",kind:"pribuzna",level:2,rule:"Ubývat souvisí se slovem být ve významu ubývání, zmenšování."},
  {letter:"B",before:"b",after:"da",ans:"í",sentence:"V nouzi mu pomohla velká <strong>b_da</strong>.",kind:"nevyjmenovana",level:2,rule:"Bída není vyjmenované slovo; píšeme měkké í."},
  {letter:"B",before:"b",after:"lý",ans:"í",sentence:"Sníh byl po ránu krásně <strong>b_lý</strong>.",kind:"nevyjmenovana",level:1,rule:"Bílý není vyjmenované ani příbuzné slovo po B."},
  {letter:"B",before:"b",after:"skup",ans:"i",sentence:"<strong>B_skup</strong> vedl slavnostní mši.",kind:"nevyjmenovana",level:2,rule:"Biskup není vyjmenované slovo po B."},
  {letter:"B",before:"ob",after:"hat",ans:"í",sentence:"Musíme <strong>ob_hat</strong> kaluž.",kind:"nevyjmenovana",level:2,rule:"Obíhat se píše s měkkým í."},

  {letter:"B",before:"sb",after:"rat",ans:"í",sentence:"Musíme <strong>sb_rat</strong> všechny papíry.",kind:"nevyjmenovana",level:2,rule:"Sbírat se píše s měkkým í."},
  {letter:"B",before:"nab",after:"zet",ans:"í",sentence:"Chci ti <strong>nab_zet</strong> pomoc.",kind:"nevyjmenovana",level:2,rule:"Nabízet se píše s měkkým í."},
  {letter:"B",before:"dob",after:"hat",ans:"í",sentence:"Pes začal <strong>dob_hat</strong> míček.",kind:"nevyjmenovana",level:2,rule:"Dobíhat se píše s měkkým í."},
  {letter:"B",before:"prob",after:"hat",ans:"í",sentence:"Musíme <strong>prob_hat</strong> celý park.",kind:"nevyjmenovana",level:2,rule:"Probíhat se píše s měkkým í."},

  // L
  {letter:"L",before:"sl",after:"šet",ans:"y",sentence:"Z dálky je <strong>sl_šet</strong> zpěv ptáků.",kind:"vyjmenovana",level:1,rule:"Slyšet je vyjmenované slovo po L."},
  {letter:"L",before:"ml",after:"n",ans:"ý",sentence:"U potoka stojí starý vodní <strong>ml_n</strong>.",kind:"vyjmenovana",level:1,rule:"Mlýn je vyjmenované slovo po L."},
  {letter:"L",before:"bl",after:"skat",ans:"ý",sentence:"Na obloze se začalo <strong>bl_skat</strong>.",kind:"vyjmenovana",level:1,rule:"Blýskat se je vyjmenované slovo po L."},
  {letter:"L",before:"pol",after:"kat",ans:"y",sentence:"Sousto musíme dobře <strong>pol_kat</strong>.",kind:"vyjmenovana",level:1,rule:"Polykat je vyjmenované slovo po L."},
  {letter:"L",before:"pl",after:"ne",ans:"y",sentence:"Čas rychle <strong>pl_ne</strong> jako voda.",kind:"tvar",level:1,rule:"Plynout je vyjmenované slovo po L. Zde je použit tvar plyne."},
  {letter:"L",before:"pl",after:"tvat",ans:"ý",sentence:"Jídlem se nesmí <strong>pl_tvat</strong>.",kind:"vyjmenovana",level:1,rule:"Plýtvat je vyjmenované slovo po L."},
  {letter:"L",before:"vzl",after:"kat",ans:"y",sentence:"Malé dítě začalo smutně <strong>vzl_kat</strong>.",kind:"vyjmenovana",level:1,rule:"Vzlykat je vyjmenované slovo po L."},
  {letter:"L",before:"l",after:"sou",ans:"y",sentence:"Dědeček má úplně <strong>l_sou</strong> hlavu.",kind:"tvar",level:2,rule:"Lysý je vyjmenované slovo po L. Lysou je jeho tvar."},
  {letter:"L",before:"l",after:"tko",ans:"ý",sentence:"Po běhání mě bolí pravé <strong>l_tko</strong>.",kind:"vyjmenovana",level:1,rule:"Lýtko je vyjmenované slovo po L."},
  {letter:"L",before:"l",after:"ka",ans:"ý",sentence:"Z lipového <strong>l_ka</strong> se pletou košíky.",kind:"vyjmenovana",level:1,rule:"Lýko je vyjmenované slovo po L."},
  {letter:"L",before:"l",after:"že",ans:"y",sentence:"V zimě jezdíme na hory na <strong>l_že</strong>.",kind:"vyjmenovana",level:1,rule:"Lyže je vyjmenované slovo po L."},
  {letter:"L",before:"Pel",after:"něk",ans:"y",sentence:"Na kraji cesty roste hořký <strong>Pel_něk</strong>.",kind:"vyjmenovana",level:2,rule:"Pelyněk patří mezi vyjmenovaná slova po L."},
  {letter:"L",before:"pl",after:"š",ans:"y",sentence:"Medvídek měl hebký <strong>pl_š</strong>.",kind:"vyjmenovana",level:3,rule:"Plyš se řadí k vyjmenovaným slovům po L."},
  {letter:"L",before:"pl",after:"tký",ans:"y",sentence:"Tento rybník je velmi <strong>pl_tký</strong>.",kind:"vyjmenovana",level:3,rule:"Plytký patří mezi vyjmenovaná slova po L."},
  {letter:"L",before:"l",after:"ška",ans:"i",sentence:"Zrzavá <strong>l_ška</strong> běžela do lesa.",kind:"nevyjmenovana",level:1,rule:"Liška není vyjmenované slovo."},
  {letter:"L",before:"l",after:"stí",ans:"i",sentence:"Na podzim padá ze stromů barevné <strong>l_stí</strong>.",kind:"nevyjmenovana",level:1,rule:"Listí není vyjmenované slovo."},
  {letter:"L",before:"lž",after:"cí",ans:"í",sentence:"Polévku jíme velkou <strong>lž_cí</strong>.",kind:"nevyjmenovana",level:1,rule:"Lžíce se píše s měkkým í."},
  {letter:"L",before:"bl",after:"zký",ans:"í",sentence:"Můj <strong>bl_zký</strong> kamarád bydlí vedle.",kind:"nevyjmenovana",level:2,rule:"Blízký souvisí se slovem blízko, nikoli s vyjmenovaným slovem blýskat."},
  {letter:"L",before:"l",after:"pa",ans:"í",sentence:"U domu roste vysoká <strong>l_pa</strong>.",kind:"nevyjmenovana",level:1,rule:"Lípa není vyjmenované slovo."},
  {letter:"L",before:"l",after:"tat",ans:"í",sentence:"Děti se učí <strong>l_tat</strong> na trampolíně.",kind:"nevyjmenovana",level:2,rule:"Lítat se píše s měkkým í."},
  {letter:"L",before:"l",after:"zat",ans:"í",sentence:"Nedovol psovi <strong>l_zat</strong> talíř.",kind:"nevyjmenovana",level:2,rule:"Lízat se píše s měkkým í."},

  {letter:"L",before:"l",after:"stek",ans:"í",sentence:"V knize byl založený <strong>l_stek</strong>.",kind:"nevyjmenovana",level:1,rule:"Lístek se píše s měkkým í."},
  {letter:"L",before:"l",after:"dé",ans:"i",sentence:"Na náměstí čekali <strong>l_dé</strong>.",kind:"nevyjmenovana",level:1,rule:"Lidé se píše s měkkým i."},
  {letter:"L",before:"l",after:"nka",ans:"i",sentence:"Na stole ležela modrá <strong>l_nka</strong>.",kind:"nevyjmenovana",level:2,rule:"Linka se píše s měkkým i."},

const summary = $("summary");
const progress = $("progress");
const feedback = $("feedback");
const nextBtn = $("nextBtn");
const opt1 = $("opt1");
const opt2 = $("opt2");
const buttons = [opt1,opt2];
starCount.textContent = stars;

function saveStars(){
  try { localStorage.setItem("hravaCestinaStars", String(stars)); } catch(e) {}
  starCount.textContent = stars;
}
function playSound(type){
  if(!soundOn) return;
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if(!AudioCtx) return;
  try{
    if(!audioContext) audioContext = new AudioCtx();
    if(audioContext.state === "suspended") audioContext.resume();
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.connect(gain); gain.connect(audioContext.destination);
    const now = audioContext.currentTime;
    if(type === "success"){
      osc.type="sine"; osc.frequency.setValueAtTime(523.25,now);
      osc.frequency.setValueAtTime(659.25,now+.1);
      gain.gain.setValueAtTime(.12,now); gain.gain.exponentialRampToValueAtTime(.001,now+.3);
      osc.start(now); osc.stop(now+.3);
    }else{
      osc.type="triangle"; osc.frequency.setValueAtTime(220,now);
      osc.frequency.linearRampToValueAtTime(160,now+.22);
      gain.gain.setValueAtTime(.1,now); gain.gain.exponentialRampToValueAtTime(.001,now+.25);
      osc.start(now); osc.stop(now+.25);
    }
  }catch(e){ /* Zvuk je doplněk; hra musí fungovat i bez něj. */ }
}
function shuffle(items){
  const a=[...items];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function filteredWords(){
  const level = Number($("levelSelect").value);
  const category = $("categorySelect").value;
  return PLAYABLE_WORDS.filter(w =>
    (letter === "ALL" || w.letter === letter) &&
    (w.level <= level) &&
    (category === "all" || (category === "dvojice" ? w.kind === "dvojice" : category === "vyjmenovana" ? w.kind === "vyjmenovana" : category === "pribuzna" ? ["pribuzna","tvar"].includes(w.kind) : w.kind === "nevyjmenovana"))
  );
}
function showEmptyState(){
  $("wordDisplay").textContent = "Zkus jiný výběr 🙂";
  $("sentence").textContent = "Pro tuto kombinaci obtížnosti a okruhu zatím nejsou připravené otázky.";
  $("options").style.display="none";
  feedback.className="feedback show";
  $("feedbackTitle").textContent="Nic se neděje!";
  $("feedbackText").textContent="Změň obtížnost, písmeno nebo druh procvičování.";
  nextBtn.classList.remove("show");
}
function renderWord(word){
  current=word; answered=false;
  feedback.className="feedback";
  $("feedbackTitle").textContent="";
  $("feedbackText").textContent="";
  nextBtn.classList.remove("show");
  $("options").style.display="grid";
  buttons.forEach(b=>{b.disabled=false;b.className="option";});
  const correctPair = ["a","e"].includes(word.ans) ? [word.ans, word.ans] : (["ý","í"].includes(word.ans) ? ["ý","í"] : ["y","i"]);
  // V této aplikaci se procvičuje i/y, včetně dlouhých variant.
  const pair = ["ý","í"].includes(word.ans) ? ["ý","í"] : ["y","i"];
  const displayPair = shuffle(pair);
  buttons.forEach((b,i)=>{b.textContent=displayPair[i];b.dataset.value=displayPair[i];});
  $("wordDisplay").innerHTML = `${escapeHtml(word.before)}<span class="blank" id="blank">&nbsp;</span>${escapeHtml(word.after)}`;
  $("sentence").innerHTML = word.sentence;
  $("sentence").setAttribute("aria-label",word.sentence.replace(/<[^>]*>/g,"").replace("_","chybějící písmeno"));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function choosePracticeWord(){
  const pool=filteredWords();
  if(!pool.length){showEmptyState();return;}
  // Slova, ve kterých dítě chybovalo, dostávají vyšší šanci na opakování.
  const weighted=[];
  pool.forEach(w=>{
    const weight=1+(wrongCounts[w.before+"_"+w.ans+w.after]||0)*2;
    for(let i=0;i<Math.min(weight,7);i++) weighted.push(w);
  });
  let next=weighted[Math.floor(Math.random()*weighted.length)];
  if(pool.length>1 && next===current){
    const alternatives=pool.filter(w=>w!==current);
    next=alternatives[Math.floor(Math.random()*alternatives.length)];
  }
  previousPracticeId=next;
  renderWord(next);
}
function startChallenge(){
  const pool=shuffle(filteredWords());
  if(!pool.length){showEmptyState();return;}
  activeChallengeLength=Math.min(10,pool.length);
  challenge=pool.slice(0,activeChallengeLength);
  challengeIndex=0;challengeCorrect=0;challengeMistakes=[];
  summary.classList.remove("show");quiz.style.display="flex";
  progress.style.display="flex";
  $("options").style.display="grid";
  loadChallengeWord();
}
function loadChallengeWord(){
  if(challengeIndex>=activeChallengeLength){showSummary();return;}
  $("counter").textContent=`Otázka ${challengeIndex+1} / ${activeChallengeLength}`;
  $("score").textContent=`Správně: ${challengeCorrect}`;
  $("progressFill").style.width=`${(challengeIndex/activeChallengeLength)*100}%`;
  renderWord(challenge[challengeIndex]);
}
function handleAnswer(value,button){
  if(answered || !current) return;
  answered=true;
  const correct=value===current.ans;
  const blank=$("blank");
  if(blank){blank.textContent=current.ans;blank.classList.add(correct?"correct":"wrong");}
  buttons.forEach(b=>{
    b.disabled=true;
    if(b.dataset.value===current.ans)b.classList.add("good");
  });
  const fullWord=current.before+current.ans+current.after;
  if(correct){
    playSound("success");stars++;saveStars();
    feedback.className="feedback success show";
    $("feedbackTitle").textContent=`✅ Skvěle! (${kindLabel(current.kind)})`;
    $("feedbackText").textContent=current.rule;
    if(mode==="challenge")challengeCorrect++;
  }else{
    playSound("error");button.classList.add("bad");
    wrongCounts[fullWord]=(wrongCounts[fullWord]||0)+1;
    feedback.className="feedback error show";
    $("feedbackTitle").textContent=`❌ Správně je „${fullWord}“.`;
    $("feedbackText").textContent=`${kindLabel(current.kind)}: ${current.rule}`;
    if(mode==="challenge")challengeMistakes.push({word:fullWord,chosen:value,rule:current.rule});
  }
  // Doplnění se promítne i do věty, aby dítě vidělo správný tvar v kontextu.
  $("sentence").innerHTML=current.sentence.replace("_",current.ans);
  if(mode==="challenge"){
    challengeIndex++;
    $("score").textContent=`Správně: ${challengeCorrect}`;
    $("progressFill").style.width=`${(challengeIndex/activeChallengeLength)*100}%`;
    nextBtn.textContent=challengeIndex>=activeChallengeLength?"Zobrazit výsledky 🏆":"Další slovo ➔";
  }else nextBtn.textContent="Další slovo ➔";
  nextBtn.classList.add("show");
}
function kindLabel(kind){
  return ({vyjmenovana:"Vyjmenované slovo",pribuzna:"Slovo příbuzné",tvar:"Tvar vyjmenovaného slova",nevyjmenovana:"Nevyjmenované slovo",dvojice:"Významová dvojice"})[kind]||"Pravopis";
}
function showSummary(){
  quiz.style.display="none";summary.classList.add("show");
  $("finalScore").textContent=`${challengeCorrect}/${activeChallengeLength}`;
  if(challengeCorrect===activeChallengeLength)$("summaryMessage").textContent="Fantastické! Všechno správně! 🌟";
  else if(challengeCorrect>=Math.ceil(activeChallengeLength*.7))$("summaryMessage").textContent="Velmi dobrá práce! Projdi si chyby a zkus to znovu.";
  else $("summaryMessage").textContent="Každá chyba je příležitost se něco naučit. Zkus si projít slova níže.";
  const list=$("mistakes");list.replaceChildren();
  if(challengeMistakes.length){
    const heading=document.createElement("strong");heading.textContent="Co si ještě procvičit:";list.appendChild(heading);
    challengeMistakes.forEach(m=>{
      const item=document.createElement("div");item.className="mistake";
      const strong=document.createElement("strong");strong.textContent=m.word;
      item.append(strong,document.createTextNode(` (zvoleno „${m.chosen}“) – ${m.rule}`));list.appendChild(item);
    });
  }else{
    const perfect=document.createElement("p");perfect.textContent="Bez jediné chyby. Jen tak dál!";list.appendChild(perfect);
  }
}
function startPractice(){
  progress.style.display="none";summary.classList.remove("show");quiz.style.display="flex";choosePracticeWord();
}
function openGame(){
  homeScreen.style.display="none";gameWrapper.style.display="flex";
  mode="practice";
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode==="practice"));
  startPractice();
}
function goHome(){
  gameWrapper.style.display="none";homeScreen.style.display="flex";
  // Skóre se záměrně neresetuje.
}
$("startApp").addEventListener("click",openGame);
$("homeLogo").addEventListener("click",goHome);
$("soundToggle").addEventListener("click",()=>{
  soundOn=!soundOn;$("soundToggle").textContent=soundOn?"🔊":"🔇";
  $("soundToggle").setAttribute("aria-label",soundOn?"Vypnout zvuk":"Zapnout zvuk");
});
document.querySelectorAll(".mode-btn").forEach(btn=>btn.addEventListener("click",()=>{
  mode=btn.dataset.mode;
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b===btn));
  if(mode==="challenge")startChallenge();else startPractice();
}));
document.querySelectorAll(".letter").forEach(btn=>btn.addEventListener("click",()=>{
  letter=btn.dataset.letter;
  document.querySelectorAll(".letter").forEach(b=>b.classList.toggle("active",b===btn));
  if(mode==="challenge")startChallenge();else startPractice();
}));
$("levelSelect").addEventListener("change",()=>mode==="challenge"?startChallenge():startPractice());
$("categorySelect").addEventListener("change",()=>mode==="challenge"?startChallenge():startPractice());
buttons.forEach(btn=>btn.addEventListener("click",()=>handleAnswer(btn.dataset.value,btn)));
nextBtn.addEventListener("click",()=>{
  if(mode==="challenge")loadChallengeWord();else choosePracticeWord();
});
$("restart").addEventListener("click",startChallenge);

// Kontrola dat při načtení: žádná hratelná položka nesmí mít neplatnou odpověď.
const invalidItems=PLAYABLE_WORDS.filter(w=>!["y","i","ý","í"].includes(w.ans)||!w.sentence.includes("_"));
if(invalidItems.length)console.warn("Zkontroluj položky WORD_BANK:",invalidItems);
</script>
</body>
</html>
